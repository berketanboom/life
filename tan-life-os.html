<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAN — Life OS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --accent-dj: #ff3c5a;
    --accent-akademik: #00e5ff;
    --accent-kariyer: #b8ff57;
    --accent-kisisel: #ff9f43;
    --text: #f0f0f0;
    --text-muted: #666;
    --text-dim: #444;
    --done-bg: #1a1a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  /* HEADER */
  .header {
    padding: 40px 32px 28px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
  }

  .header-left h1 {
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
    margin-bottom: 6px;
  }

  .header-left .tagline {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.1;
    color: var(--text);
  }

  .global-progress {
    text-align: right;
    min-width: 120px;
  }

  .global-pct {
    font-size: 42px;
    font-weight: 800;
    font-family: 'Space Mono', monospace;
    line-height: 1;
    background: linear-gradient(135deg, var(--accent-dj), var(--accent-akademik), var(--accent-kariyer));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .global-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
    margin-top: 2px;
  }

  .global-bar-wrap {
    margin-top: 8px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .global-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dj), var(--accent-akademik), var(--accent-kariyer));
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  }

  /* TIME TABS */
  .time-tabs {
    display: flex;
    gap: 0;
    padding: 0 32px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .time-tab {
    padding: 16px 20px;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }

  .time-tab:hover { color: var(--text); }
  .time-tab.active {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  /* MAIN LAYOUT */
  .main {
    padding: 32px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    max-width: 1400px;
  }

  /* CATEGORY CARD */
  .cat-card {
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .cat-card:hover { border-color: #333; }

  .cat-header {
    padding: 20px 20px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .cat-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .cat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .cat-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .cat-count {
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    color: var(--text-muted);
    background: var(--surface2);
    padding: 3px 8px;
    border-radius: 20px;
  }

  .cat-progress-wrap {
    padding: 12px 20px 0;
  }

  .cat-progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .cat-pct {
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    color: var(--text-muted);
  }

  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* TASK LIST */
  .task-list {
    padding: 8px 0;
  }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s;
    border-radius: 0;
    position: relative;
  }

  .task-item:hover { background: var(--surface2); }

  .task-item.done {
    opacity: 0.45;
  }

  .task-item.done .task-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .task-checkbox {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 1.5px solid var(--border);
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    background: transparent;
  }

  .task-item.done .task-checkbox {
    border-color: transparent;
  }

  .task-checkbox svg {
    width: 10px;
    height: 10px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .task-item.done .task-checkbox svg { opacity: 1; }

  .task-content {
    flex: 1;
    min-width: 0;
  }

  .task-text {
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text);
    transition: color 0.2s;
  }

  .task-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
    font-family: 'Space Mono', monospace;
    line-height: 1.4;
  }

  .task-tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.05em;
    flex-shrink: 0;
    margin-top: 2px;
    font-weight: 700;
    opacity: 0.7;
  }

  /* ADD TASK */
  .add-task-row {
    padding: 8px 20px 16px;
    display: flex;
    gap: 8px;
  }

  .add-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 12px;
    font-family: 'Syne', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  .add-input:focus { border-color: #555; }
  .add-input::placeholder { color: var(--text-dim); }

  .add-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
    line-height: 1;
  }

  .add-btn:hover {
    background: #222;
    color: var(--text);
  }

  /* EMPTY STATE */
  .empty-state {
    padding: 24px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    font-family: 'Space Mono', monospace;
  }

  /* SECTION DIVIDER within task list */
  .time-divider {
    padding: 6px 20px 2px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-family: 'Space Mono', monospace;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 600px) {
    .header { padding: 24px 16px 20px; }
    .time-tabs { padding: 0 16px; }
    .main { padding: 16px; gap: 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>TAN — Life OS</h1>
    <div class="tagline">Büyük hedefler,<br>küçük adımlar.</div>
  </div>
  <div class="global-progress">
    <div class="global-pct" id="globalPct">0%</div>
    <div class="global-label">tamamlandı</div>
    <div class="global-bar-wrap">
      <div class="global-bar-fill" id="globalBar" style="width:0%"></div>
    </div>
  </div>
</div>

<div class="time-tabs">
  <button class="time-tab active" data-tab="bu-hafta">Bu Hafta</button>
  <button class="time-tab" data-tab="bu-ay">Bu Ay</button>
  <button class="time-tab" data-tab="3-ay">3 Ay İçinde</button>
  <button class="time-tab" data-tab="uzun-vade">Uzun Vade</button>
  <button class="time-tab" data-tab="hepsi">Tümü</button>
</div>

<div class="main" id="mainGrid"></div>

<script>
const CATEGORIES = [
  { id: 'dj',       label: 'DJ & Müzik',    color: '#ff3c5a',  accent: '#ff3c5a' },
  { id: 'akademik', label: 'Akademik',       color: '#00e5ff',  accent: '#00e5ff' },
  { id: 'kariyer',  label: 'Kariyer',        color: '#b8ff57',  accent: '#b8ff57' },
  { id: 'kisisel',  label: 'Kişisel',        color: '#ff9f43',  accent: '#ff9f43' },
];

const DEFAULT_TASKS = [
  // === DJ ===
  { id:'dj1',  cat:'dj', time:'bu-hafta',  text:'SoundCloud / Mixcloud hesabı aç', sub:'Profesyonel profil fotoğrafı + bio ekle' },
  { id:'dj2',  cat:'dj', time:'bu-hafta',  text:'Kayıtlık bir mix seç veya kaydet', sub:'60–90 dk, house/techno hybrid, Utrecht sahnesine uygun' },
  { id:'dj3',  cat:'dj', time:'bu-ay',     text:'Mix\'i SoundCloud\'a yükle', sub:'Başlık + tags + Utrecht/Amsterdam lokasyonu' },
  { id:'dj4',  cat:'dj', time:'bu-ay',     text:'Resident Advisor profili oluştur', sub:'Utrecht lokasyonu ile, mix linkini ekle' },
  { id:'dj5',  cat:'dj', time:'bu-ay',     text:'BASIS Utrecht Instagram\'ını takip et', sub:'BASIS Talents gecesini araştır, duyuru takibi başlat' },
  { id:'dj6',  cat:'dj', time:'bu-ay',     text:'ACU, WAS., Poema\'ya DM at', sub:'"Eylül\'de taşınıyorum, müziğimi dinler misiniz?" — kısa ve profesyonel' },
  { id:'dj7',  cat:'dj', time:'3-ay',      text:'Utrecht\'e vardıktan sonra BASIS\'e git', sub:'Sahne arkasındaki insanlarla tanış, yüz yüze konuş' },
  { id:'dj8',  cat:'dj', time:'3-ay',      text:'İlk küçük gig veya student partisi al', sub:'Üniversite kolektifleri, özel etkinlikler — network başlangıcı' },
  { id:'dj9',  cat:'dj', time:'3-ay',      text:'Utrecht\'teki local DJ\'lerle sosyal medyada etkileşime gir', sub:'Repost, yorum — yüzün tanınmaya başlasın' },
  { id:'dj10', cat:'dj', time:'uzun-vade', text:'BASIS Talents gecesinde set al', sub:'İlk 6 ay network + tanışma, sonrasında başvur' },
  { id:'dj11', cat:'dj', time:'uzun-vade', text:'Amsterdam\'da ilk gig (OT301 veya Vondelbunker)', sub:'Utrecht\'te birikim yaptıktan sonra' },

  // === AKADEMİK ===
  { id:'ak1',  cat:'akademik', time:'bu-hafta',  text:'Thesis PsychoPy v3 son bug kontrolü', sub:'UI\'ya dokunmadan sadece fonksiyon testleri' },
  { id:'ak2',  cat:'akademik', time:'bu-hafta',  text:'Utrecht MSc kabul mektubunu ve koşulları tekrar oku', sub:'Conditional offer gereksinimlerini listele' },
  { id:'ak3',  cat:'akademik', time:'bu-ay',     text:'Burs sonuçlarını takip et', sub:'NL Holland Scholarship + Radboud Scholarship — Nisan ortası bekleniyor' },
  { id:'ak4',  cat:'akademik', time:'bu-ay',     text:'UvA Brain & Cognition itiraz durumunu kontrol et', sub:'Bekleme süreci — güncel durum nedir?' },
  { id:'ak5',  cat:'akademik', time:'bu-ay',     text:'Imperial College London başvurularını takip et', sub:'MSc Translational Neuro + MRes Experimental Neuro' },
  { id:'ak6',  cat:'akademik', time:'bu-ay',     text:'Thesis veri toplama takvimini oluştur', sub:'Katılımcı sayısı, oturum planı, Seda Dural ile sync' },
  { id:'ak7',  cat:'akademik', time:'3-ay',      text:'Thesis yazımını tamamla', sub:'Giriş → Yöntem → Bulgular → Tartışma sırası' },
  { id:'ak8',  cat:'akademik', time:'3-ay',      text:'Mezuniyet hazırlıkları', sub:'Haziran 2026 — diploma, tören, evrak' },
  { id:'ak9',  cat:'akademik', time:'uzun-vade', text:'Utrecht\'te ilk dönem derslerine hazırlık', sub:'Applied Cognitive Psychology müfredatını incele' },
  { id:'ak10', cat:'akademik', time:'uzun-vade', text:'ISMIR 2026 / 2027 için paper fikri geliştir', sub:'Thesis bulgularından türetilebilir — Spotify Research görünürlüğü' },

  // === KARİYER ===
  { id:'kar1',  cat:'kariyer', time:'bu-hafta',  text:'LinkedIn profilini güncelle', sub:'Utrecht kabul + thesis başlığını ekle' },
  { id:'kar2',  cat:'kariyer', time:'bu-hafta',  text:'Ryan McGarry (Google UX) ile mesajlaş', sub:'Mezuniyet sonrası plan hakkında görüşme talebi' },
  { id:'kar3',  cat:'kariyer', time:'bu-ay',     text:'SQL öğrenmeye başla', sub:'Google/Coursera SQL kursları değil — Mode Analytics veya Leetcode SQL' },
  { id:'kar4',  cat:'kariyer', time:'bu-ay',     text:'Figma temellerini öğren', sub:'Ücretsiz Figma Community ile — haftada 2 saat yeterli başlangıç' },
  { id:'kar5',  cat:'kariyer', time:'3-ay',      text:'Utrecht programındaki zorunlu staj yerleşimi araştır', sub:'Spotify Amsterdam + Google için başvuru takvimi oluştur' },
  { id:'kar6',  cat:'kariyer', time:'3-ay',      text:'Spotify Amsterdam staj başvurusu hazırla', sub:'LinkedIn easy apply + referans zinciri kur' },
  { id:'kar7',  cat:'kariyer', time:'3-ay',      text:'FUGA, Armada, Spinnin\' gibi Amsterdam müzik şirketlerini araştır', sub:'Alternatif staj / junior PM hedefleri' },
  { id:'kar8',  cat:'kariyer', time:'uzun-vade', text:'Spotify Amsterdam veya Google\'da PM / UX Research rolü', sub:'5 yıl hedefi — Utrecht stajı kritik dönüm noktası' },
  { id:'kar9',  cat:'kariyer', time:'uzun-vade', text:'ISMIR konferansına katıl', sub:'Spotify Research ekibiyle yüz yüze tanışma fırsatı' },

  // === KİŞİSEL ===
  { id:'kis1', cat:'kisisel', time:'bu-hafta',  text:'Utrecht için konaklama araştırmaya başla', sub:'Öğrenci konutları + özel kiralık daire seçenekleri' },
  { id:'kis2', cat:'kisisel', time:'bu-ay',     text:'BSN numarası ve Hollanda kayıt süreci araştır', sub:'Taşındıktan sonraki ilk 5 iş günü içinde yapılması gerekiyor' },
  { id:'kis3', cat:'kisisel', time:'bu-ay',     text:'Temel Hollandaca öğrenmeye başla', sub:'Duolingo yeterli değil — Language Transfer Dutch ücretsiz ve iyi' },
  { id:'kis4', cat:'kisisel', time:'3-ay',      text:'Utrecht\'e taşınma lojistiği', sub:'Uçuş, kargo, geçici konaklama planı' },
  { id:'kis5', cat:'kisisel', time:'uzun-vade', text:'Amsterdam veya Utrecht\'te kalıcı düzen kur', sub:'Sosyal çevre, rutin, müzik + akademi dengesi' },
];

const STORAGE_KEY = 'tan_life_os_v2';

let state = {
  tasks: [],
  activeTab: 'bu-hafta'
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state.tasks = saved.tasks || DEFAULT_TASKS.map(t => ({...t, done: false}));
      state.activeTab = saved.activeTab || 'bu-hafta';
    } else {
      state.tasks = DEFAULT_TASKS.map(t => ({...t, done: false}));
    }
  } catch(e) {
    state.tasks = DEFAULT_TASKS.map(t => ({...t, done: false}));
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function getFilteredTasks(catId) {
  return state.tasks.filter(t => {
    const catMatch = t.cat === catId;
    const tabMatch = state.activeTab === 'hepsi' || t.time === state.activeTab;
    return catMatch && tabMatch;
  });
}

function globalStats() {
  const all = state.tasks;
  if (!all.length) return 0;
  return Math.round(all.filter(t => t.done).length / all.length * 100);
}

function catStats(catId) {
  const tasks = state.tasks.filter(t => t.cat === catId);
  if (!tasks.length) return { pct: 0, done: 0, total: 0 };
  const done = tasks.filter(t => t.done).length;
  return { pct: Math.round(done / tasks.length * 100), done, total: tasks.length };
}

function toggleTask(id) {
  const t = state.tasks.find(t => t.id === id);
  if (t) { t.done = !t.done; saveState(); render(); }
}

function addTask(catId, text) {
  if (!text.trim()) return;
  const id = 'custom_' + Date.now();
  state.tasks.push({
    id, cat: catId, time: state.activeTab === 'hepsi' ? 'bu-ay' : state.activeTab,
    text: text.trim(), sub: '', done: false
  });
  saveState();
  render();
}

function checkIcon(color) {
  return `<svg viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M1.5 5L4 7.5L8.5 2.5" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function renderCard(cat) {
  const tasks = getFilteredTasks(cat.id);
  const stats = catStats(cat.id);
  const visibleTasks = tasks;

  const taskHTML = visibleTasks.length === 0
    ? `<div class="empty-state">Bu zaman diliminde görev yok</div>`
    : visibleTasks.map(t => `
      <div class="task-item ${t.done ? 'done' : ''}" onclick="toggleTask('${t.id}')">
        <div class="task-checkbox" style="${t.done ? `background:${cat.color}22; border-color:${cat.color}66;` : ''}">
          ${checkIcon(cat.color)}
        </div>
        <div class="task-content">
          <div class="task-text">${t.text}</div>
          ${t.sub ? `<div class="task-sub">${t.sub}</div>` : ''}
        </div>
      </div>
    `).join('');

  return `
    <div class="cat-card">
      <div class="cat-header">
        <div class="cat-title-row">
          <div class="cat-dot" style="background:${cat.color}"></div>
          <div class="cat-title" style="color:${cat.color}">${cat.label}</div>
        </div>
        <div class="cat-count">${stats.done}/${stats.total}</div>
      </div>
      <div class="cat-progress-wrap">
        <div class="cat-progress-top">
          <span class="cat-pct">${stats.pct}% tamamlandı</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${stats.pct}%; background:${cat.color}"></div>
        </div>
      </div>
      <div class="task-list">${taskHTML}</div>
      <div class="add-task-row">
        <input class="add-input" id="add-${cat.id}" placeholder="Yeni görev ekle..." onkeydown="if(event.key==='Enter'){addTask('${cat.id}',this.value);this.value='';}">
        <button class="add-btn" onclick="const inp=document.getElementById('add-${cat.id}');addTask('${cat.id}',inp.value);inp.value=''">+</button>
      </div>
    </div>
  `;
}

function render() {
  // Update global
  const pct = globalStats();
  document.getElementById('globalPct').textContent = pct + '%';
  document.getElementById('globalBar').style.width = pct + '%';

  // Update tabs
  document.querySelectorAll('.time-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.tab === state.activeTab);
  });

  // Render grid
  document.getElementById('mainGrid').innerHTML = CATEGORIES.map(cat => renderCard(cat)).join('');
}

// Tab clicks
document.querySelectorAll('.time-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.activeTab = tab.dataset.tab;
    saveState();
    render();
  });
});

loadState();
render();
</script>
</body>
</html>
